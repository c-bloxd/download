<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C Bloxd</title>
    <link rel="icon" type="image/png" href="assets/images/icon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />

    <meta property="og:title" content="C Bloxd">
    <meta property="og:description" content="Play With Style.">
    <meta property="og:image" content="https://raw.githubusercontent.com/c-bloxd/download/refs/heads/main/assets/images/acc-icon.png">
</head>

<body>
    <div class="info-wrapper">
        <button class="info-btn">
            <i class="ri-information-2-fill"></i>
        </button>

        <div class="tooltip">
            Website made by <span class="highlight">GEORGECR</span>
        </div>
    </div>

    <div class="social">
        <button class="jobs-btn"><i class="ri-briefcase-4-fill"></i></button>
        <button class="youtube-btn"><i class="ri-youtube-fill"></i></button>
        <button class="discord-btn"><i class="ri-discord-fill"></i></button>
    </div>
    <div class="container">

        <div class="box small">
            <img src="assets/images/folder.png" alt="Minecraft" class="icon no-select">

            <h2 class="no-select">C_Bloxd Essentials</h2>
            <p class="owner no-select">Asset Pack</p>

            <button id="Asset-btn" class="download-btn no-select small-btn">Download</button>
        </div>

        <div class="box main">
            <img src="assets/images/tpack-icon.png" alt="Minecraft" class="icon no-select">

            <h2 class="no-select">C_Fault 8x</h2>
            <p class="owner no-select">by El Quiro</p>

            <button id="Tpack-btn" class="download-btn no-select">Download</button>
        </div>

        <div class="box small">
            <img src="assets/images/bob-rig.png" alt="Minecraft" class="icon no-select">

            <h2 class="no-select">Bob Rig</h2>
            <p class="owner no-select">for Blockbench</p>

            <button id="Rig-btn" class="download-btn no-select small-btn">Download</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
